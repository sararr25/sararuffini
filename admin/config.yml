---
backend:
  name: github
  repo: sararr25/sararuffini
  branch: main
  base_url: https://decap-proxy.sararuffini25.workers.dev
  auth_endpoint: auth
media_folder: public/assets/media
public_folder: "/assets/media"
local_backend: true
locale: it
publish_mode: simple
collections:
- name: site_settings
  label: "\U0001F310 Site Settings"
  description: Global site configuration
  files:
  - label: Global Navigation & Footer
    name: global
    file: public/content/global.json
    editor:
      preview: false
    fields:
    - label: Brand Name
      name: brand_name
      widget: string
      default: Sara Ruffini
      required: false
    - label: Brand Link
      name: brand_href
      widget: string
      default: /index.html
      required: false
    - label: Brand Link Preset
      name: brand_href_page
      widget: select
      required: false
      options: &internal_page_options
      - label: Home
        value: /index.html
      - label: Projects
        value: /pages/projects
      - label: About
        value: /pages/about/index.html
      - label: Contact
        value: /pages/contact/index.html
      - label: Video Project V1
        value: /pages/weber-grillinspiration/index.html
      - label: Video Project V2
        value: /pages/video-v2/index.html
      - label: App Project V1
        value: /pages/app-v1/index.html
      - label: App Project V2
        value: /pages/app-v2/index.html
      - label: App Showcase
        value: /app-showcase
      - label: Graphics Project
        value: /pages/graphics/index.html
      - label: Social Media Portfolio
        value: /pages/socialmedia-portfolio/index.html
      - label: Social Media
        value: /social-media
      - label: Social Media Strategy
        value: /social-media-strategy
      - label: Cocktail Photography
        value: /pages/cocktail-photography/index.html
      - label: Shooting Cocktails
        value: /pages/shooting-cocktails/index.html
      - label: Neon Vibes Web Project
        value: /pages/neon-vibes-web/index.html
      - label: Webpage Portfolio
        value: /pages/webpage-portfolio/index.html
      - label: Coming Soon
        value: /pages/coming-soon/index.html
      - label: Algo Approved
        value: /algo-approved
    - label: Nav - Home
      name: nav_home
      widget: string
      default: Home
      required: false
    - label: Nav - Home Link
      name: nav_home_href
      widget: string
      default: /index.html
      required: false
    - label: Nav - Home Link Preset
      name: nav_home_href_page
      widget: select
      required: false
      options: *internal_page_options
    - label: Nav - Projects
      name: nav_projects
      widget: string
      default: Projects
      required: false
    - label: Nav - Projects Link
      name: nav_projects_href
      widget: string
      default: /pages/projects
      required: false
    - label: Nav - Projects Link Preset
      name: nav_projects_href_page
      widget: select
      required: false
      options: *internal_page_options
    - label: Nav - About
      name: nav_about
      widget: string
      default: About
      required: false
    - label: Nav - About Link
      name: nav_about_href
      widget: string
      default: /pages/about/index.html
      required: false
    - label: Nav - About Link Preset
      name: nav_about_href_page
      widget: select
      required: false
      options: *internal_page_options
    - label: Nav - Contact
      name: nav_contact
      widget: string
      default: Contact
      required: false
    - label: Nav - Contact Link
      name: nav_contact_href
      widget: string
      default: /pages/contact/index.html
      required: false
    - label: Nav - Contact Link Preset
      name: nav_contact_href_page
      widget: select
      required: false
      options: *internal_page_options
    - label: Footer Contact Email
      name: footer_email
      widget: string
      required: false
    - label: Footer Contact Phone
      name: footer_phone
      widget: string
      required: false
    - label: Footer Contact Location
      name: footer_location
      widget: string
      required: false
    - label: Footer Contact Line (full)
      name: footer_contact
      widget: string
      required: false
      hint: "e.g. email@domain.com | +45 00 00 00 00 | City"
  - label: SEO Defaults
    name: seo_defaults
    file: public/content/global-seo.json
    editor:
      preview: false
    fields:
    - label: Site Title
      name: site_title
      widget: string
      required: false
    - label: Site Description
      name: site_description
      widget: text
      required: false
    - label: Default OG Image
      name: default_og_image
      widget: image
      required: false
    - label: Default OG Image Crop Position
      name: default_og_image_crop_position
      widget: object
      image_field: default_og_image
      aspect_ratio: 1 / 1
      collapsed: false
      required: false
      default: { x: 50, y: 50, zoom: 1 }
      hint: Choose which part of the image stays visible inside cropped frames.
      fields:
      - label: Horizontal focal point (%)
        name: x
        widget: number
        value_type: int
        min: 0
        max: 100
        step: 1
        default: 50
        required: false
      - label: Vertical focal point (%)
        name: y
        widget: number
        value_type: int
        min: 0
        max: 100
        step: 1
        default: 50
        required: false
      - label: Zoom
        name: zoom
        widget: number
        value_type: float
        min: 1
        max: 3
        step: 0.05
        default: 1
        required: false
    - label: Twitter Handle
      name: twitter_handle
      widget: string
      required: false
- name: templates
