---
backend:
  name: github
  repo: sararr25/sararuffini
  branch: main
  base_url: https://decap-proxy.sararuffini25.workers.dev
  auth_endpoint: auth
media_folder: assets/media
public_folder: "/assets/media"
local_backend: true
locale: it
publish_mode: simple
collections:
- name: site_settings
  label: "\U0001F310 Site Settings"
  description: Global site configuration
  files:
  - label: Global Navigation & Footer
    name: global
    file: content/global.json
    editor:
      preview: false
    fields:
    - label: Brand Name
      name: brand_name
      widget: string
      default: Sara Ruffini
      required: false
    - label: Brand Link
      name: brand_href
      widget: string
      default: /index.html
      required: false
    - label: Nav - Home
      name: nav_home
      widget: string
      default: Home
      required: false
    - label: Nav - Home Link
      name: nav_home_href
      widget: string
      default: /index.html
      required: false
    - label: Nav - Projects
      name: nav_projects
      widget: string
      default: Projects
      required: false
    - label: Nav - Projects Link
      name: nav_projects_href
      widget: string
      default: /pages/portfolio-main/code.html
      required: false
    - label: Nav - About
      name: nav_about
      widget: string
      default: About
      required: false
    - label: Nav - About Link
      name: nav_about_href
      widget: string
      default: /pages/about/index.html
      required: false
    - label: Nav - Contact
      name: nav_contact
      widget: string
      default: Contact
      required: false
    - label: Nav - Contact Link
      name: nav_contact_href
      widget: string
      default: /pages/contact/index.html
      required: false
    - label: Footer Contact Email
      name: footer_email
      widget: string
      required: false
    - label: Footer Contact Phone
      name: footer_phone
      widget: string
      required: false
    - label: Footer Contact Location
      name: footer_location
      widget: string
      required: false
    - label: Footer Contact Line (full)
      name: footer_contact
      widget: string
      required: false
      hint: "e.g. email@domain.com | +45 00 00 00 00 | City"
  - label: SEO Defaults
    name: seo_defaults
    file: content/global-seo.json
    editor:
      preview: false
    fields:
    - label: Site Title
      name: site_title
      widget: string
      required: false
    - label: Site Description
      name: site_description
      widget: text
      required: false
    - label: Default OG Image
      name: default_og_image
      widget: image
      required: false
    - label: Twitter Handle
      name: twitter_handle
      widget: string
      required: false
