---
backend:
  name: github
  repo: sararr25/sararuffini
  branch: main
  base_url: https://decap-proxy.sararuffini25.workers.dev
  auth_endpoint: auth
media_folder: assets/media
public_folder: "/assets/media"
local_backend: true
locale: it
publish_mode: simple
collections:
- name: site_settings
  label: "\U0001F310 Site Settings"
  description: Global site configuration
  files:
  - label: Global Navigation & Footer
    name: global
    file: content/global.json
    editor:
      preview: false
    fields:
    - label: Nav - Home
      name: nav_home
      widget: string
      default: Home
      required: false
    - label: Nav - Projects
      name: nav_projects
      widget: string
      default: Projects
      required: false
    - label: Nav - About
      name: nav_about
      widget: string
      default: About
      required: false
    - label: Nav - Contact
      name: nav_contact
      widget: string
      default: Contact
      required: false
    - label: Footer Contact Email
      name: footer_email
      widget: string
      required: false
    - label: Footer Contact Phone
      name: footer_phone
      widget: string
      required: false
    - label: Footer Contact Location
      name: footer_location
      widget: string
      required: false
  - label: SEO Defaults
    name: seo_defaults
    file: content/global-seo.json
    editor:
      preview: false
    fields:
    - label: Site Title
      name: site_title
      widget: string
      required: false
    - label: Site Description
      name: site_description
      widget: text
      required: false
    - label: Default OG Image
      name: default_og_image
      widget: image
      required: false
    - label: Twitter Handle
      name: twitter_handle
      widget: string
      required: false
- name: templates
  label: "\U0001F4CB Content Templates"
  description: Reusable project templates for quick creation
  files:
  - label: Video Project Template
    name: video_template
    file: content/templates/video-template.json
    fields:
    - label: Template Name
      name: template_name
      widget: string
      default: Video Project
      required: false
    - label: Hero Label
      name: hero_label
      widget: string
      required: false
    - label: Years
      name: hero_years
      widget: string
      required: false
    - label: Main Title
      name: hero_title_main
      widget: string
      required: false
    - label: Highlight Word
      name: hero_title_highlight
      widget: string
      required: false
    - label: Role
      name: hero_role
      widget: string
      required: false
    - label: Meta Info
      name: hero_meta
      widget: string
      required: false
    - label: Hero Image
      name: hero_image
      widget: image
      required: false
    - label: Intro Text
      name: intro_text
      widget: text
      required: false
    - label: SEO Title
      name: seo_title
      widget: string
      required: false
    - label: SEO Description
      name: seo_description
      widget: text
      required: false
    - label: SEO Image
      name: seo_image
      widget: image
      required: false
    - label: Dynamic Media Blocks
      name: media_blocks
      widget: list
      required: false
      allow_add: true
      allow_delete: true
      collapsed: true
      summary: "{{fields.target_selector}} • {{fields.media_kind}} • {{fields.action}}"
      fields:
      - label: Target CSS Selector
        name: target_selector
        widget: string
        required: false
      - label: Action
        name: action
        widget: select
        required: false
        options:
        - append
        - prepend
        - replace
        - remove
      - label: Media Type
        name: media_kind
        widget: select
        required: false
        options:
        - image
        - video
        - embed
      - label: Image Upload
        name: media_upload_image
        widget: image
        required: false
      - label: Video Upload
        name: media_upload_video
        widget: file
        required: false
      - label: Media URL (image/video/embed)
        name: media_url
        widget: string
        required: false
      - label: Embed HTML (YouTube iframe etc.)
        name: embed_html
        widget: text
        required: false
      - label: Alt Text
        name: alt_text
        widget: string
        required: false
      - label: Link URL (optional wrapper)
        name: link_url
        widget: string
        required: false
      - label: Caption HTML
        name: caption_html
        widget: text
        required: false
      - label: Custom CSS Classes
        name: class_name
        widget: string
        required: false
    - label: Advanced Overrides
      name: selector_overrides
      widget: list
      required: false
      summary: "{{fields.selector}} -> {{fields.type}}"
      fields:
      - label: CSS Selector
        name: selector
        widget: string
        required: false
      - label: Tipo Modifica
        name: type
        widget: select
        options:
        - text
        - html
        - src
        - href
        - alt
        - bg
        - append_html
        - prepend_html
        - remove
        required: false
      - label: Valore
        name: value
        widget: text
        required: false
      allow_add: true
      allow_delete: true
