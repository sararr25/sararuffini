<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <link rel="stylesheet" href="../styles/mobile.css" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
  <script>
    (function () {
      if (!window.CMS || typeof createClass === 'undefined' || typeof h === 'undefined') {
        return;
      }

      function parseCrop(value) {
        var raw = typeof value === 'string' && value.trim() ? value.trim() : '50,50';
        var parts = raw.split(',');
        return {
          x: Math.max(0, Math.min(100, Number(parts[0]) || 50)),
          y: Math.max(0, Math.min(100, Number(parts[1]) || 50))
        };
      }

      function serializeCrop(crop) {
        return Math.round(crop.x) + ',' + Math.round(crop.y);
      }

      function stripImageCrop(url) {
        if (typeof url !== 'string') {
          return '';
        }

        return url.replace(/#(?:.*&)?crop=\d{1,3},\d{1,3}(?:&.*)?$/, '');
      }

      function findDeepStringByKey(target, keyName) {
        if (!target || typeof target !== 'object') {
          return '';
        }

        if (typeof target[keyName] === 'string' && target[keyName].trim()) {
          return target[keyName].trim();
        }

        if (Array.isArray(target)) {
          for (var i = 0; i < target.length; i += 1) {
            var nestedValue = findDeepStringByKey(target[i], keyName);
            if (nestedValue) {
              return nestedValue;
            }
          }
          return '';
        }

        var keys = Object.keys(target);
        for (var j = 0; j < keys.length; j += 1) {
          var key = keys[j];
          var child = target[key];
          if (child && typeof child === 'object') {
            var nested = findDeepStringByKey(child, keyName);
            if (nested) {
              return nested;
            }
          }
        }

        return '';
      }

      function resolveImageFromDom(fieldName) {
        if (!fieldName) {
          return '';
        }

        var selectors = [
          'input[name="' + fieldName + '"]',
          'input[name$=".' + fieldName + '"]',
          'input[id$="' + fieldName + '"]',
          'textarea[name="' + fieldName + '"]',
          'textarea[name$=".' + fieldName + '"]'
        ];

        for (var i = 0; i < selectors.length; i += 1) {
          var input = document.querySelector(selectors[i]);
          if (input && typeof input.value === 'string' && input.value.trim()) {
            return input.value.trim();
          }
        }

        return '';
      }

      function resolveCropImageUrl(props) {
        if (!props) {
          return '';
        }

        var fieldName = '';
        if (props.field && typeof props.field.get === 'function') {
          fieldName = props.field.get('name') || '';
        }

        if (!fieldName && typeof props.forID === 'string') {
          var idParts = props.forID.split('.');
          fieldName = idParts[idParts.length - 1] || '';
        }

        if (!fieldName) {
          return '';
        }

        var candidates = [];
        if (/_crop_position$/.test(fieldName)) {
          candidates.push(fieldName.replace(/_crop_position$/, ''));
        }
        candidates.push(fieldName.replace(/_crop$/, ''));

        var uniqueCandidates = [];
        candidates.forEach(function (candidate) {
          if (candidate && uniqueCandidates.indexOf(candidate) === -1) {
            uniqueCandidates.push(candidate);
          }
        });

        var entryData = props.entry && typeof props.entry.toJS === 'function' ? props.entry.toJS() : null;
        for (var i = 0; i < uniqueCandidates.length; i += 1) {
          var key = uniqueCandidates[i];
          var direct = entryData && typeof entryData[key] === 'string' ? entryData[key].trim() : '';
          if (direct) {
            return stripImageCrop(direct);
          }

          var deep = findDeepStringByKey(entryData, key);
          if (deep) {
            return stripImageCrop(deep);
          }

          var fromDom = resolveImageFromDom(key);
          if (fromDom) {
            return stripImageCrop(fromDom);
          }
        }

        return '';
      }

      var CropPositionControl = createClass({
        getInitialState: function () {
          return {
            isEditorOpen: false,
            zoom: 140,
            isDragging: false
          };
        },

        setCrop: function (crop) {
          this.props.onChange(serializeCrop(crop));
        },

        openEditor: function () {
          this.setState({ isEditorOpen: true });
        },

        closeEditor: function () {
          this.setState({ isEditorOpen: false, isDragging: false });
        },

        setZoom: function (value) {
          var zoom = Number(value);
          if (!isFinite(zoom)) {
            return;
          }

          this.setState({ zoom: Math.max(100, Math.min(300, zoom)) });
        },

        setCropFromEvent: function (event) {
          var canvas = this.canvasRef;
          if (!canvas) {
            return;
          }

          var point = event.touches && event.touches[0] ? event.touches[0] : event;
          if (!point) {
            return;
          }

          var rect = canvas.getBoundingClientRect();
          if (!rect.width || !rect.height) {
            return;
          }

          var x = ((point.clientX - rect.left) / rect.width) * 100;
          var y = ((point.clientY - rect.top) / rect.height) * 100;
          this.setCrop({
            x: Math.max(0, Math.min(100, x)),
            y: Math.max(0, Math.min(100, y))
          });
        },

        onCanvasMouseDown: function (event) {
          event.preventDefault();
          this.setState({ isDragging: true });
          this.setCropFromEvent(event);
        },

        onCanvasMouseMove: function (event) {
          if (!this.state.isDragging) {
            return;
          }
          this.setCropFromEvent(event);
        },

        onCanvasMouseUp: function () {
          if (!this.state.isDragging) {
            return;
          }
          this.setState({ isDragging: false });
        },

        onCanvasTouchStart: function (event) {
          this.setCropFromEvent(event);
        },

        onCanvasTouchMove: function (event) {
          event.preventDefault();
          this.setCropFromEvent(event);
        },

        componentWillUnmount: function () {
          if (this.state && this.state.isDragging) {
            this.setState({ isDragging: false });
          }
        },

        renderButton: function (label, x, y) {
          return h('button', {
            key: label,
            type: 'button',
            onClick: function () {
              this.setCrop({ x: x, y: y });
            }.bind(this),
            style: {
              minHeight: '30px',
              border: '1px solid #d1d5db',
              borderRadius: '4px',
              background: '#ffffff',
              cursor: 'pointer',
              fontSize: '11px',
              fontWeight: '700'
            }
          }, label);
        },

        render: function () {
          var crop = parseCrop(this.props.value);
          var imageUrl = resolveCropImageUrl(this.props);
          var hasImage = !!imageUrl;
          var zoomPercent = this.state.zoom;
          return h('div', {
            id: this.props.forID,
            className: this.props.classNameWrapper,
            style: {
              display: 'flex',
              flexDirection: 'column',
              gap: '10px',
              padding: '10px',
              border: '1px solid #d1d5db',
              borderRadius: '8px',
              background: '#f9fafb'
            }
          }, [
            h('div', {
              key: 'hero-row',
              style: {
                display: 'flex',
                alignItems: 'center',
                gap: '10px',
                flexWrap: 'wrap'
              }
            }, [
              hasImage
                ? h('img', {
                    key: 'thumb',
                    src: imageUrl,
                    alt: 'Preview immagine',
                    style: {
                      width: '96px',
                      height: '60px',
                      objectFit: 'cover',
                      objectPosition: crop.x + '% ' + crop.y + '%',
                      borderRadius: '6px',
                      border: '1px solid #111827'
                    }
                  })
                : h('div', {
                    key: 'thumb-placeholder',
                    style: {
                      width: '96px',
                      height: '60px',
                      borderRadius: '6px',
                      border: '1px dashed #9ca3af',
                      background: '#ffffff',
                      display: 'flex',
                      alignItems: 'center',
                      justifyContent: 'center',
                      color: '#6b7280',
                      fontSize: '10px',
                      textAlign: 'center',
                      padding: '4px'
                    }
                  }, 'Nessuna immagine'),
              h('button', {
                key: 'open-editor',
                type: 'button',
                onClick: this.openEditor,
                disabled: !hasImage,
                style: {
                  minHeight: '34px',
                  border: '1px solid #1d4ed8',
                  borderRadius: '6px',
                  background: hasImage ? '#2563eb' : '#d1d5db',
                  color: hasImage ? '#ffffff' : '#6b7280',
                  cursor: hasImage ? 'pointer' : 'not-allowed',
                  fontSize: '12px',
                  fontWeight: '700',
                  padding: '0 12px'
                }
              }, 'Crop immagine'),
              h('small', {
                key: 'coords',
                style: {
                  color: '#4b5563',
                  fontSize: '12px'
                }
              }, 'Posizione: ' + Math.round(crop.x) + '% / ' + Math.round(crop.y) + '%')
            ]),
            h('div', {
              key: 'preview',
              style: {
                width: '100%',
                maxWidth: '260px',
                aspectRatio: '16 / 9',
                border: '1px solid #111827',
                borderRadius: '6px',
                background:
                  'radial-gradient(circle at ' + crop.x + '% ' + crop.y + '%, #2563eb 0 8px, transparent 9px), linear-gradient(90deg, rgba(17,24,39,.12) 1px, transparent 1px), linear-gradient(rgba(17,24,39,.12) 1px, transparent 1px)',
                backgroundSize: 'auto, 33.33% 100%, 100% 33.33%'
              }
            }),
            h('div', {
              key: 'grid',
              style: {
                display: 'grid',
                gridTemplateColumns: 'repeat(3, minmax(0, 1fr))',
                gap: '4px',
                maxWidth: '260px'
              }
            }, [
              this.renderButton('TL', 0, 0),
              this.renderButton('T', 50, 0),
              this.renderButton('TR', 100, 0),
              this.renderButton('L', 0, 50),
              this.renderButton('C', 50, 50),
              this.renderButton('R', 100, 50),
              this.renderButton('BL', 0, 100),
              this.renderButton('B', 50, 100),
              this.renderButton('BR', 100, 100)
            ]),
            h('label', { key: 'x', style: { display: 'flex', flexDirection: 'column', gap: '4px', fontSize: '12px' } }, [
              'X: ' + crop.x + '%',
              h('input', {
                type: 'range',
                min: 0,
                max: 100,
                step: 1,
                value: crop.x,
                onChange: function (event) {
                  this.setCrop({ x: event.target.value, y: crop.y });
                }.bind(this)
              })
            ]),
            h('label', { key: 'y', style: { display: 'flex', flexDirection: 'column', gap: '4px', fontSize: '12px' } }, [
              'Y: ' + crop.y + '%',
              h('input', {
                type: 'range',
                min: 0,
                max: 100,
                step: 1,
                value: crop.y,
                onChange: function (event) {
                  this.setCrop({ x: crop.x, y: event.target.value });
                }.bind(this)
              })
            ]),
            h('small', { key: 'hint', style: { color: '#4b5563', lineHeight: 1.35 } },
              'Choose which part of the image stays visible inside cropped frames. The original file is not changed.'
            ),
            this.state.isEditorOpen && hasImage
              ? h('div', {
                  key: 'editor-overlay',
                  onMouseUp: this.onCanvasMouseUp,
                  style: {
                    position: 'fixed',
                    inset: '0',
                    background: 'rgba(17,24,39,.55)',
                    zIndex: 5000,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '16px'
                  }
                }, [
                  h('div', {
                    key: 'editor-modal',
                    style: {
                      width: 'min(960px, 100%)',
                      maxHeight: '92vh',
                      overflow: 'auto',
                      background: '#ffffff',
                      borderRadius: '12px',
                      border: '1px solid #d1d5db',
                      boxShadow: '0 20px 50px rgba(0, 0, 0, .25)',
                      padding: '16px',
                      display: 'flex',
                      flexDirection: 'column',
                      gap: '12px'
                    },
                    onClick: function (event) {
                      event.stopPropagation();
                    }
                  }, [
                    h('div', {
                      key: 'editor-header',
                      style: {
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between',
                        gap: '12px'
                      }
                    }, [
                      h('strong', { key: 'title', style: { fontSize: '14px' } }, 'Editor Crop'),
                      h('button', {
                        key: 'close',
                        type: 'button',
                        onClick: this.closeEditor,
                        style: {
                          minHeight: '32px',
                          border: '1px solid #d1d5db',
                          borderRadius: '6px',
                          background: '#ffffff',
                          cursor: 'pointer',
                          fontWeight: '700',
                          padding: '0 10px'
                        }
                      }, 'Chiudi')
                    ]),
                    h('div', {
                      key: 'canvas',
                      ref: function (node) {
                        this.canvasRef = node;
                      }.bind(this),
                      onMouseDown: this.onCanvasMouseDown,
                      onMouseMove: this.onCanvasMouseMove,
                      onMouseLeave: this.onCanvasMouseUp,
                      onTouchStart: this.onCanvasTouchStart,
                      onTouchMove: this.onCanvasTouchMove,
                      style: {
                        width: '100%',
                        aspectRatio: '16 / 9',
                        border: '2px solid #111827',
                        borderRadius: '10px',
                        cursor: this.state.isDragging ? 'grabbing' : 'crosshair',
                        backgroundImage:
                          'radial-gradient(circle at ' + crop.x + '% ' + crop.y + '%, rgba(37,99,235,.95) 0 8px, rgba(37,99,235,.3) 9px 16px, transparent 17px), linear-gradient(90deg, rgba(17,24,39,.2) 1px, transparent 1px), linear-gradient(rgba(17,24,39,.2) 1px, transparent 1px), url("' + imageUrl.replace(/"/g, '\\"') + '")',
                        backgroundSize: 'auto, 33.33% 100%, 100% 33.33%, ' + zoomPercent + '% ' + zoomPercent + '%',
                        backgroundPosition: 'center, center, center, ' + crop.x + '% ' + crop.y + '%',
                        backgroundRepeat: 'no-repeat'
                      }
                    }),
                    h('div', {
                      key: 'controls',
                      style: {
                        display: 'grid',
                        gridTemplateColumns: 'auto 1fr auto auto',
                        gap: '10px',
                        alignItems: 'center'
                      }
                    }, [
                      h('label', { key: 'zoom-label', style: { fontSize: '12px', fontWeight: '700' } }, 'Zoom'),
                      h('input', {
                        key: 'zoom-range',
                        type: 'range',
                        min: 100,
                        max: 300,
                        step: 5,
                        value: zoomPercent,
                        onChange: function (event) {
                          this.setZoom(event.target.value);
                        }.bind(this)
                      }),
                      h('span', {
                        key: 'zoom-value',
                        style: { fontSize: '12px', minWidth: '56px', textAlign: 'right' }
                      }, zoomPercent + '%'),
                      h('button', {
                        key: 'center',
                        type: 'button',
                        onClick: function () {
                          this.setCrop({ x: 50, y: 50 });
                        }.bind(this),
                        style: {
                          minHeight: '30px',
                          border: '1px solid #d1d5db',
                          borderRadius: '6px',
                          background: '#ffffff',
                          cursor: 'pointer',
                          fontSize: '12px',
                          fontWeight: '700',
                          padding: '0 8px'
                        }
                      }, 'Centra')
                    ]),
                    h('small', {
                      key: 'editor-hint',
                      style: { color: '#4b5563', lineHeight: 1.35 }
                    }, 'Clicca o trascina sull\'immagine per scegliere il punto di crop. Usa lo zoom per maggiore precisione.')
                  ])
                ])
              : null
          ]);
        }
      });

      CMS.registerWidget('crop_position', CropPositionControl);
    })();

  </script>
  <script>
    (function () {
      function slugify(value) {
        if (typeof value !== 'string') return '';

        return value
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9\s-]/g, '')
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '');
      }

      function getCollectionName() {
        var parts = window.location.hash.split('/');
        var index = parts.indexOf('collections');
        return index >= 0 ? parts[index + 1] : '';
      }

      function getCollectionFieldMap() {
        var collection = getCollectionName();

        if (collection === 'project_pages_entries') {
          return { title: 'entry_title', slug: 'slug' };
        }

        if (collection === 'project_pages') {
          return { title: 'page_name', slug: 'page_slug' };
        }

        return null;
      }

      function findFieldInput(fieldName) {
        var candidates = [
          'input[name="' + fieldName + '"]',
          'textarea[name="' + fieldName + '"]',
          '[data-slate-editor="true"][name="' + fieldName + '"]'
        ];

        for (var i = 0; i < candidates.length; i += 1) {
          var node = document.querySelector(candidates[i]);
          if (node) return node;
        }

        return null;
      }

      function setInputValue(input, value) {
        var prototype = input instanceof HTMLTextAreaElement ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
        var nativeSetter = Object.getOwnPropertyDescriptor(prototype, 'value');
        if (nativeSetter && nativeSetter.set) {
          nativeSetter.set.call(input, value);
        } else {
          input.value = value;
        }

        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }

      function setStatusText(host, message) {
        var status = host.querySelector('[data-slug-sync-status]');
        if (!status) return;
        status.textContent = message;
      }

      function buildControls(slugInput, titleInput) {
        if (!slugInput || !titleInput) return;
        if (slugInput.dataset.slugSyncReady === 'true') return;

        slugInput.dataset.slugSyncReady = 'true';
        var wrapper = slugInput.closest('div');
        if (!wrapper) return;

        var controls = document.createElement('div');
        controls.setAttribute('data-slug-sync-controls', 'true');
        controls.style.display = 'flex';
        controls.style.flexDirection = 'column';
        controls.style.gap = '8px';
        controls.style.marginTop = '8px';

        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Aggiorna link dal nome pagina';
        button.style.alignSelf = 'flex-start';
        button.style.background = '#111111';
        button.style.color = '#ffffff';
        button.style.border = '0';
        button.style.borderRadius = '6px';
        button.style.padding = '6px 10px';
        button.style.cursor = 'pointer';
        button.style.fontSize = '12px';
        button.style.fontWeight = '700';

        var status = document.createElement('small');
        status.setAttribute('data-slug-sync-status', 'true');
        status.style.color = '#4b5563';
        status.textContent = 'Se cambi il nome pagina, puoi riallineare lo slug con questo pulsante.';

        controls.appendChild(button);
        controls.appendChild(status);
        wrapper.appendChild(controls);

        var lastAutoSlug = slugify(titleInput.value || '');

        function syncSlugFromTitle(force) {
          var nextSlug = slugify(titleInput.value || '');
          if (!nextSlug) {
            setStatusText(controls, 'Inserisci un nome pagina valido per generare lo slug.');
            return;
          }

          var currentSlug = (slugInput.value || '').trim();
          var shouldAutoSync = force || !currentSlug || currentSlug !== nextSlug || currentSlug === lastAutoSlug;
          if (!shouldAutoSync) {
            return;
          }

          setInputValue(slugInput, nextSlug);
          lastAutoSlug = nextSlug;
          if (force) {
            setStatusText(controls, 'Slug aggiornato dal nome pagina: /pages/' + nextSlug + '/index.html');
          } else {
            setStatusText(controls, 'Slug sincronizzato automaticamente: /pages/' + nextSlug + '/index.html');
          }
        }

        titleInput.addEventListener('input', function () {
          syncSlugFromTitle(false);
        });

        slugInput.addEventListener('input', function () {
          var value = (slugInput.value || '').trim();
          if (value && value !== lastAutoSlug) {
            setStatusText(controls, 'Slug manuale attivo. Premi il pulsante per riallinearlo al nome pagina.');
          }
        });

        button.addEventListener('click', function () {
          syncSlugFromTitle(true);
        });

        // First pass for new entries and existing entries missing slug.
        syncSlugFromTitle(false);
      }

      function isImageField(input) {
        var name = (input.getAttribute('name') || '').toLowerCase();
        var value = (input.value || '').trim();
        var imageName = /(image|img|photo|poster|thumbnail|cover|avatar|media|seo_image)/.test(name);
        var imageValue = /\.(png|jpe?g|webp|gif|avif|svg)(?:[?#].*)?$/i.test(value) ||
          /^\/assets\/media\//.test(value) ||
          /^https?:\/\/.+/i.test(value) && /(image|googleusercontent|cloudinary|unsplash|assets|media)/i.test(value);

        return imageName || imageValue;
      }

      function parseCropValue(value) {
        var match = String(value || '').match(/#(?:.*&)?crop=(\d{1,3}),(\d{1,3})(?:&.*)?$/);
        return {
          x: match ? Math.max(0, Math.min(100, Number(match[1]))) : 50,
          y: match ? Math.max(0, Math.min(100, Number(match[2]))) : 50
        };
      }

      function stripCropValue(value) {
        return String(value || '').replace(/#(?:.*&)?crop=\d{1,3},\d{1,3}(?:&.*)?$/, '');
      }

      function withCropValue(value, crop) {
        var cleanValue = stripCropValue(value).trim();
        if (!cleanValue) return '';
        return cleanValue + '#crop=' + Math.round(crop.x) + ',' + Math.round(crop.y);
      }

      function makeCropButton(label, x, y, onClick) {
        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = label;
        button.style.minHeight = '28px';
        button.style.border = '1px solid #d1d5db';
        button.style.borderRadius = '4px';
        button.style.background = '#ffffff';
        button.style.cursor = 'pointer';
        button.style.fontSize = '11px';
        button.addEventListener('click', function () {
          onClick({ x: x, y: y });
        });
        return button;
      }

      function buildImageCropControls(input) {
        if (input.dataset.cropControlsReady === 'true') return;
        input.dataset.cropControlsReady = 'true';

        var wrapper = input.closest('div');
        if (!wrapper) return;

        var controls = document.createElement('div');
        controls.setAttribute('data-image-crop-controls', 'true');
        controls.style.display = 'none';
        controls.style.flexDirection = 'column';
        controls.style.gap = '8px';
        controls.style.marginTop = '10px';
        controls.style.padding = '10px';
        controls.style.border = '1px solid #d1d5db';
        controls.style.borderRadius = '8px';
        controls.style.background = '#f9fafb';

        var title = document.createElement('strong');
        title.textContent = 'Crop / posizione immagine';
        title.style.fontSize = '12px';

        var hint = document.createElement('small');
        hint.textContent = "Scegli quale parte dell'immagine deve restare visibile nei frame con ritaglio. Il file originale non viene modificato.";
        hint.style.color = '#4b5563';
        hint.style.lineHeight = '1.35';

        var preview = document.createElement('div');
        preview.style.width = '100%';
        preview.style.maxWidth = '260px';
        preview.style.aspectRatio = '16 / 9';
        preview.style.border = '1px solid #111827';
        preview.style.borderRadius = '6px';
        preview.style.backgroundSize = 'cover';
        preview.style.backgroundColor = '#e5e7eb';
        preview.style.overflow = 'hidden';

        var grid = document.createElement('div');
        grid.style.display = 'grid';
        grid.style.gridTemplateColumns = 'repeat(3, minmax(0, 1fr))';
        grid.style.gap = '4px';
        grid.style.maxWidth = '260px';

        var sliderX = document.createElement('input');
        sliderX.type = 'range';
        sliderX.min = '0';
        sliderX.max = '100';
        sliderX.step = '1';

        var sliderY = document.createElement('input');
        sliderY.type = 'range';
        sliderY.min = '0';
        sliderY.max = '100';
        sliderY.step = '1';

        var status = document.createElement('small');
        status.style.color = '#374151';

        function refresh() {
          var value = input.value || '';
          var cleanValue = stripCropValue(value);
          var crop = parseCropValue(value);
          var hasImage = !!cleanValue.trim();

          controls.style.display = hasImage ? 'flex' : 'none';
          if (!hasImage) return;

          sliderX.value = String(crop.x);
          sliderY.value = String(crop.y);
          preview.style.backgroundImage = 'url("' + cleanValue.replace(/"/g, '\\"') + '")';
          preview.style.backgroundPosition = crop.x + '% ' + crop.y + '%';
          status.textContent = 'Posizione: ' + crop.x + '% orizzontale, ' + crop.y + '% verticale';
        }

        function update(crop) {
          var next = {
            x: Math.max(0, Math.min(100, Number(crop.x))),
            y: Math.max(0, Math.min(100, Number(crop.y)))
          };
          setInputValue(input, withCropValue(input.value || '', next));
          refresh();
        }

        [
          ['TL', 0, 0], ['T', 50, 0], ['TR', 100, 0],
          ['L', 0, 50], ['C', 50, 50], ['R', 100, 50],
          ['BL', 0, 100], ['B', 50, 100], ['BR', 100, 100]
        ].forEach(function (item) {
          grid.appendChild(makeCropButton(item[0], item[1], item[2], update));
        });

        sliderX.addEventListener('input', function () {
          update({ x: sliderX.value, y: sliderY.value });
        });
        sliderY.addEventListener('input', function () {
          update({ x: sliderX.value, y: sliderY.value });
        });
        input.addEventListener('input', refresh);
        input.addEventListener('change', refresh);

        controls.appendChild(title);
        controls.appendChild(hint);
        controls.appendChild(preview);
        controls.appendChild(grid);
        controls.appendChild(status);
        controls.appendChild(sliderX);
        controls.appendChild(sliderY);
        wrapper.appendChild(controls);
        refresh();
      }

      function wireImageCropControls() {
        document.querySelectorAll('input[name], textarea[name]').forEach(function (input) {
          if (!isImageField(input)) return;
          buildImageCropControls(input);
        });
      }

      function wireEditorEnhancements() {
        wireImageCropControls();

        var fieldMap = getCollectionFieldMap();
        if (!fieldMap) return;

        var titleInput = findFieldInput(fieldMap.title);
        var slugInput = findFieldInput(fieldMap.slug);
        if (!titleInput || !slugInput) return;

        buildControls(slugInput, titleInput);
      }

      var observer = new MutationObserver(function () {
        wireEditorEnhancements();
      });

      observer.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('hashchange', wireEditorEnhancements);
      window.addEventListener('load', wireEditorEnhancements);
      setInterval(wireEditorEnhancements, 1200);
    })();
  </script>
</body>
</html>
