<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
  <link rel="stylesheet" href="../styles/mobile.css" />
</head>
<body>
  <script src="https://unpkg.com/decap-cms@3.8.3/dist/decap-cms.js"></script>
  <script>
    (function () {
      if (!window.CMS || typeof createClass === 'undefined' || typeof h === 'undefined') {
        return;
      }

      function parseCrop(value) {
        var raw = typeof value === 'string' && value.trim() ? value.trim() : '50,50';
        var parts = raw.split(',');
        return {
          x: Math.max(0, Math.min(100, Number(parts[0]) || 50)),
          y: Math.max(0, Math.min(100, Number(parts[1]) || 50))
        };
      }

      function serializeCrop(crop) {
        return Math.round(crop.x) + ',' + Math.round(crop.y);
      }

      function stripImageCrop(url) {
        if (typeof url !== 'string') {
          return '';
        }

        return url.replace(/#(?:.*&)?crop=\d{1,3},\d{1,3}(?:&.*)?$/, '');
      }

      function findDeepStringByKey(target, keyName) {
        if (!target || typeof target !== 'object') {
          return '';
        }

        if (typeof target[keyName] === 'string' && target[keyName].trim()) {
          return target[keyName].trim();
        }

        if (Array.isArray(target)) {
          for (var i = 0; i < target.length; i += 1) {
            var nestedValue = findDeepStringByKey(target[i], keyName);
            if (nestedValue) {
              return nestedValue;
            }
          }
          return '';
        }

        var keys = Object.keys(target);
        for (var j = 0; j < keys.length; j += 1) {
          var key = keys[j];
          var child = target[key];
          if (child && typeof child === 'object') {
            var nested = findDeepStringByKey(child, keyName);
            if (nested) {
              return nested;
            }
          }
        }

        return '';
      }

      function resolveImageFromDom(fieldName) {
        if (!fieldName) {
          return '';
        }

        var selectors = [
          'input[name="' + fieldName + '"]',
          'input[name$=".' + fieldName + '"]',
          'input[id$="' + fieldName + '"]',
          'textarea[name="' + fieldName + '"]',
          'textarea[name$=".' + fieldName + '"]'
        ];

        for (var i = 0; i < selectors.length; i += 1) {
          var input = document.querySelector(selectors[i]);
          if (input && typeof input.value === 'string' && input.value.trim()) {
            return input.value.trim();
          }
        }

        return '';
      }

      function resolveCropImageUrl(props) {
        if (!props) {
          return '';
        }

        var fieldName = '';
        if (props.field && typeof props.field.get === 'function') {
          fieldName = props.field.get('name') || '';
        }

        if (!fieldName && typeof props.forID === 'string') {
          var idParts = props.forID.split('.');
          fieldName = idParts[idParts.length - 1] || '';
        }

        if (!fieldName) {
          return '';
        }

        var candidates = [];
        if (/_crop_position$/.test(fieldName)) {
          candidates.push(fieldName.replace(/_crop_position$/, ''));
        }
        candidates.push(fieldName.replace(/_crop$/, ''));

        var uniqueCandidates = [];
        candidates.forEach(function (candidate) {
          if (candidate && uniqueCandidates.indexOf(candidate) === -1) {
            uniqueCandidates.push(candidate);
          }
        });

        var entryData = props.entry && typeof props.entry.toJS === 'function' ? props.entry.toJS() : null;
        for (var i = 0; i < uniqueCandidates.length; i += 1) {
          var key = uniqueCandidates[i];
          var direct = entryData && typeof entryData[key] === 'string' ? entryData[key].trim() : '';
          if (direct) {
            return stripImageCrop(direct);
          }

          var deep = findDeepStringByKey(entryData, key);
          if (deep) {
            return stripImageCrop(deep);
          }

          var fromDom = resolveImageFromDom(key);
          if (fromDom) {
            return stripImageCrop(fromDom);
          }
        }

        return '';
      }

      var CropPositionControl = createClass({
        getInitialState: function () {
          return {
            isEditorOpen: false,
            zoom: 130,
            isDragging: false
          };
        },

        setCrop: function (crop) {
          this.props.onChange(serializeCrop(crop));
        },

        openEditor: function () {
          this.setState({ isEditorOpen: true });
        },

        closeEditor: function () {
          this.setState({ isEditorOpen: false, isDragging: false });
        },

        setZoom: function (value) {
          var zoom = Number(value);
          if (!isFinite(zoom)) {
            return;
          }

          this.setState({ zoom: Math.max(100, Math.min(280, zoom)) });
        },

        changeZoom: function (delta) {
          this.setZoom((this.state.zoom || 130) + delta);
        },

        setCropFromPointer: function (event) {
          var editor = this.editorRef;
          if (!editor) {
            return;
          }

          var point = event.touches && event.touches[0] ? event.touches[0] : event;
          if (!point) {
            return;
          }

          var rect = editor.getBoundingClientRect();
          if (!rect.width || !rect.height) {
            return;
          }

          var x = ((point.clientX - rect.left) / rect.width) * 100;
          var y = ((point.clientY - rect.top) / rect.height) * 100;
          this.setCrop({
            x: Math.max(0, Math.min(100, x)),
            y: Math.max(0, Math.min(100, y))
          });
        },

        onEditorMouseDown: function (event) {
          event.preventDefault();
          this.setState({ isDragging: true });
          this.setCropFromPointer(event);
        },

        onEditorMouseMove: function (event) {
          if (!this.state.isDragging) {
            return;
          }

          this.setCropFromPointer(event);
        },

        stopDragging: function () {
          if (this.state.isDragging) {
            this.setState({ isDragging: false });
          }
        },

        onEditorTouchStart: function (event) {
          this.setCropFromPointer(event);
        },

        onEditorTouchMove: function (event) {
          event.preventDefault();
          this.setCropFromPointer(event);
        },

        renderImageSurface: function (key, imageUrl, crop, zoom, showGuides) {
          var safeUrl = imageUrl.replace(/"/g, '\\"');
          return h('div', {
            key: key,
            style: {
              width: '100%',
              aspectRatio: '16 / 9',
              border: showGuides ? '2px solid #111827' : '1px solid #d1d5db',
              borderRadius: showGuides ? '10px' : '8px',
              backgroundImage: showGuides
                ? 'linear-gradient(90deg, rgba(255,255,255,.25) 1px, transparent 1px), linear-gradient(rgba(255,255,255,.25) 1px, transparent 1px), radial-gradient(circle at ' + crop.x + '% ' + crop.y + '%, rgba(0,0,0,.0) 0 5px, rgba(255,255,255,.9) 6px 8px, rgba(255,255,255,0) 9px), url("' + safeUrl + '")'
                : 'url("' + safeUrl + '")',
              backgroundSize: showGuides
                ? '33.33% 100%, 100% 33.33%, auto, ' + zoom + '% ' + zoom + '%'
                : zoom + '% ' + zoom + '%',
              backgroundPosition: showGuides
                ? 'center, center, center, ' + crop.x + '% ' + crop.y + '%'
                : crop.x + '% ' + crop.y + '%',
              backgroundRepeat: 'no-repeat',
              overflow: 'hidden'
            }
          });
        },

        render: function () {
          var crop = parseCrop(this.props.value);
          var imageUrl = resolveCropImageUrl(this.props);
          var hasImage = !!imageUrl;
          var zoom = this.state.zoom;

          return h('div', {
            id: this.props.forID,
            className: this.props.classNameWrapper,
            style: {
              display: 'flex',
              flexDirection: 'column',
              gap: '10px',
              padding: '12px',
              border: '1px solid #d1d5db',
              borderRadius: '8px',
              background: '#f9fafb'
            }
          }, [
            h('strong', {
              key: 'title',
              style: { fontSize: '12px', letterSpacing: '.02em' }
            }, 'Crop position'),
            hasImage
              ? this.renderImageSurface('mini-preview', imageUrl, crop, 100, false)
              : h('div', {
                  key: 'placeholder',
                  style: {
                    width: '100%',
                    maxWidth: '360px',
                    aspectRatio: '16 / 9',
                    border: '1px dashed #9ca3af',
                    borderRadius: '8px',
                    background: '#ffffff',
                    color: '#6b7280',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    fontSize: '12px'
                  }
                }, 'Carica prima l\'immagine per usare il crop'),
            h('div', {
              key: 'actions',
              style: {
                display: 'flex',
                alignItems: 'center',
                gap: '10px',
                flexWrap: 'wrap'
              }
            }, [
              h('button', {
                key: 'open-editor',
                type: 'button',
                onClick: this.openEditor,
                disabled: !hasImage,
                style: {
                  minHeight: '34px',
                  border: '1px solid #1d4ed8',
                  borderRadius: '6px',
                  background: hasImage ? '#2563eb' : '#d1d5db',
                  color: hasImage ? '#ffffff' : '#6b7280',
                  cursor: hasImage ? 'pointer' : 'not-allowed',
                  fontSize: '12px',
                  fontWeight: '700',
                  padding: '0 12px'
                }
              }, 'Apri editor crop'),
              h('small', {
                key: 'coords',
                style: {
                  color: '#4b5563',
                  fontSize: '12px'
                }
              }, 'Vista attuale: ' + Math.round(crop.x) + '% / ' + Math.round(crop.y) + '%')
            ]),
            h('small', {
              key: 'hint',
              style: { color: '#4b5563', lineHeight: 1.35 }
            }, 'Nell\'editor puoi trascinare l\'immagine e usare zoom +/- per scegliere esattamente la parte che verra mostrata.'),
            this.state.isEditorOpen && hasImage
              ? h('div', {
                  key: 'editor-overlay',
                  onMouseUp: this.stopDragging,
                  style: {
                    position: 'fixed',
                    inset: '0',
                    background: 'rgba(17,24,39,.55)',
                    zIndex: 5000,
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '16px'
                  }
                }, [
                  h('div', {
                    key: 'editor-modal',
                    onClick: function (event) { event.stopPropagation(); },
                    style: {
                      width: 'min(980px, 100%)',
                      maxHeight: '92vh',
                      overflow: 'auto',
                      background: '#ffffff',
                      borderRadius: '12px',
                      border: '1px solid #d1d5db',
                      boxShadow: '0 20px 50px rgba(0, 0, 0, .25)',
                      padding: '16px',
                      display: 'flex',
                      flexDirection: 'column',
                      gap: '14px'
                    }
                  }, [
                    h('div', {
                      key: 'header',
                      style: {
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'space-between',
                        gap: '12px'
                      }
                    }, [
                      h('strong', { key: 'header-title', style: { fontSize: '14px' } }, 'Editor crop immagine'),
                      h('button', {
                        key: 'close',
                        type: 'button',
                        onClick: this.closeEditor,
                        style: {
                          minHeight: '32px',
                          border: '1px solid #d1d5db',
                          borderRadius: '6px',
                          background: '#ffffff',
                          cursor: 'pointer',
                          fontWeight: '700',
                          padding: '0 10px'
                        }
                      }, 'Chiudi')
                    ]),
                    h('div', {
                      key: 'workspace',
                      style: {
                        display: 'grid',
                        gridTemplateColumns: '2fr 1fr',
                        gap: '14px'
                      }
                    }, [
                      h('div', {
                        key: 'editor-panel',
                        style: {
                          display: 'flex',
                          flexDirection: 'column',
                          gap: '8px'
                        }
                      }, [
                        h('small', { key: 'editor-label', style: { color: '#374151' } }, 'Editor: trascina per scegliere il punto visibile'),
                        h('div', {
                          key: 'editor-surface',
                          ref: function (node) { this.editorRef = node; }.bind(this),
                          onMouseDown: this.onEditorMouseDown,
                          onMouseMove: this.onEditorMouseMove,
                          onMouseLeave: this.stopDragging,
                          onTouchStart: this.onEditorTouchStart,
                          onTouchMove: this.onEditorTouchMove,
                          style: {
                            cursor: this.state.isDragging ? 'grabbing' : 'grab'
                          }
                        }, [this.renderImageSurface('editor-surface-inner', imageUrl, crop, zoom, true)])
                      ]),
                      h('div', {
                        key: 'preview-panel',
                        style: {
                          display: 'flex',
                          flexDirection: 'column',
                          gap: '8px'
                        }
                      }, [
                        h('small', { key: 'preview-label', style: { color: '#374151' } }, 'Anteprima reale di cio che verra mostrato'),
                        this.renderImageSurface('preview-surface', imageUrl, crop, 100, false),
                        h('small', { key: 'preview-coords', style: { color: '#4b5563' } }, 'Posizione: ' + Math.round(crop.x) + '% / ' + Math.round(crop.y) + '%')
                      ])
                    ]),
                    h('div', {
                      key: 'controls',
                      style: {
                        display: 'grid',
                        gridTemplateColumns: 'auto auto 1fr auto auto',
                        gap: '8px',
                        alignItems: 'center'
                      }
                    }, [
                      h('span', { key: 'zoom-label', style: { fontSize: '12px', fontWeight: '700' } }, 'Zoom'),
                      h('button', {
                        key: 'zoom-out',
                        type: 'button',
                        onClick: function () { this.changeZoom(-10); }.bind(this),
                        style: {
                          minHeight: '30px',
                          minWidth: '30px',
                          border: '1px solid #d1d5db',
                          borderRadius: '6px',
                          background: '#ffffff',
                          cursor: 'pointer',
                          fontWeight: '700'
                        }
                      }, '-'),
                      h('input', {
                        key: 'zoom-range',
                        type: 'range',
                        min: 100,
                        max: 280,
                        step: 2,
                        value: zoom,
                        onChange: function (event) {
                          this.setZoom(event.target.value);
                        }.bind(this)
                      }),
                      h('button', {
                        key: 'zoom-in',
                        type: 'button',
                        onClick: function () { this.changeZoom(10); }.bind(this),
                        style: {
                          minHeight: '30px',
                          minWidth: '30px',
                          border: '1px solid #d1d5db',
                          borderRadius: '6px',
                          background: '#ffffff',
                          cursor: 'pointer',
                          fontWeight: '700'
                        }
                      }, '+'),
                      h('span', {
                        key: 'zoom-value',
                        style: { fontSize: '12px', minWidth: '56px', textAlign: 'right' }
                      }, zoom + '%')
                    ]),
                    h('div', {
                      key: 'footer',
                      style: {
                        display: 'flex',
                        justifyContent: 'space-between',
                        alignItems: 'center',
                        gap: '10px',
                        flexWrap: 'wrap'
                      }
                    }, [
                      h('button', {
                        key: 'center',
                        type: 'button',
                        onClick: function () {
                          this.setCrop({ x: 50, y: 50 });
                        }.bind(this),
                        style: {
                          minHeight: '30px',
                          border: '1px solid #d1d5db',
                          borderRadius: '6px',
                          background: '#ffffff',
                          cursor: 'pointer',
                          fontSize: '12px',
                          fontWeight: '700',
                          padding: '0 10px'
                        }
                      }, 'Centra immagine'),
                      h('small', {
                        key: 'footer-note',
                        style: { color: '#4b5563', lineHeight: 1.35 }
                      }, 'Il crop salva solo la posizione (x,y). Il file originale non viene modificato.')
                    ])
                  ])
                ])
              : null
          ]);
        }
      });

      CMS.registerWidget('crop_position', CropPositionControl);
    })();

  </script>
  <script>
    (function () {
      function slugify(value) {
        if (typeof value !== 'string') return '';

        return value
          .normalize('NFD')
          .replace(/[\u0300-\u036f]/g, '')
          .toLowerCase()
          .trim()
          .replace(/[^a-z0-9\s-]/g, '')
          .replace(/\s+/g, '-')
          .replace(/-+/g, '-')
          .replace(/^-|-$/g, '');
      }

      function getCollectionName() {
        var parts = window.location.hash.split('/');
        var index = parts.indexOf('collections');
        return index >= 0 ? parts[index + 1] : '';
      }

      function getCollectionFieldMap() {
        var collection = getCollectionName();

        if (collection === 'project_pages_entries') {
          return { title: 'entry_title', slug: 'slug' };
        }

        if (collection === 'project_pages') {
          return { title: 'page_name', slug: 'page_slug' };
        }

        return null;
      }

      function findFieldInput(fieldName) {
        var candidates = [
          'input[name="' + fieldName + '"]',
          'textarea[name="' + fieldName + '"]',
          '[data-slate-editor="true"][name="' + fieldName + '"]'
        ];

        for (var i = 0; i < candidates.length; i += 1) {
          var node = document.querySelector(candidates[i]);
          if (node) return node;
        }

        return null;
      }

      function setInputValue(input, value) {
        var prototype = input instanceof HTMLTextAreaElement ? window.HTMLTextAreaElement.prototype : window.HTMLInputElement.prototype;
        var nativeSetter = Object.getOwnPropertyDescriptor(prototype, 'value');
        if (nativeSetter && nativeSetter.set) {
          nativeSetter.set.call(input, value);
        } else {
          input.value = value;
        }

        input.dispatchEvent(new Event('input', { bubbles: true }));
        input.dispatchEvent(new Event('change', { bubbles: true }));
      }

      function setStatusText(host, message) {
        var status = host.querySelector('[data-slug-sync-status]');
        if (!status) return;
        status.textContent = message;
      }

      function buildControls(slugInput, titleInput) {
        if (!slugInput || !titleInput) return;
        if (slugInput.dataset.slugSyncReady === 'true') return;

        slugInput.dataset.slugSyncReady = 'true';
        var wrapper = slugInput.closest('div');
        if (!wrapper) return;

        var controls = document.createElement('div');
        controls.setAttribute('data-slug-sync-controls', 'true');
        controls.style.display = 'flex';
        controls.style.flexDirection = 'column';
        controls.style.gap = '8px';
        controls.style.marginTop = '8px';

        var button = document.createElement('button');
        button.type = 'button';
        button.textContent = 'Aggiorna link dal nome pagina';
        button.style.alignSelf = 'flex-start';
        button.style.background = '#111111';
        button.style.color = '#ffffff';
        button.style.border = '0';
        button.style.borderRadius = '6px';
        button.style.padding = '6px 10px';
        button.style.cursor = 'pointer';
        button.style.fontSize = '12px';
        button.style.fontWeight = '700';

        var status = document.createElement('small');
        status.setAttribute('data-slug-sync-status', 'true');
        status.style.color = '#4b5563';
        status.textContent = 'Se cambi il nome pagina, puoi riallineare lo slug con questo pulsante.';

        controls.appendChild(button);
        controls.appendChild(status);
        wrapper.appendChild(controls);

        var lastAutoSlug = slugify(titleInput.value || '');

        function syncSlugFromTitle(force) {
          var nextSlug = slugify(titleInput.value || '');
          if (!nextSlug) {
            setStatusText(controls, 'Inserisci un nome pagina valido per generare lo slug.');
            return;
          }

          var currentSlug = (slugInput.value || '').trim();
          var shouldAutoSync = force || !currentSlug || currentSlug !== nextSlug || currentSlug === lastAutoSlug;
          if (!shouldAutoSync) {
            return;
          }

          setInputValue(slugInput, nextSlug);
          lastAutoSlug = nextSlug;
          if (force) {
            setStatusText(controls, 'Slug aggiornato dal nome pagina: /pages/' + nextSlug + '/index.html');
          } else {
            setStatusText(controls, 'Slug sincronizzato automaticamente: /pages/' + nextSlug + '/index.html');
          }
        }

        titleInput.addEventListener('input', function () {
          syncSlugFromTitle(false);
        });

        slugInput.addEventListener('input', function () {
          var value = (slugInput.value || '').trim();
          if (value && value !== lastAutoSlug) {
            setStatusText(controls, 'Slug manuale attivo. Premi il pulsante per riallinearlo al nome pagina.');
          }
        });

        button.addEventListener('click', function () {
          syncSlugFromTitle(true);
        });

        // First pass for new entries and existing entries missing slug.
        syncSlugFromTitle(false);
      }

      function wireEditorEnhancements() {
        var fieldMap = getCollectionFieldMap();
        if (!fieldMap) return;

        var titleInput = findFieldInput(fieldMap.title);
        var slugInput = findFieldInput(fieldMap.slug);
        if (!titleInput || !slugInput) return;

        buildControls(slugInput, titleInput);
      }

      var observer = new MutationObserver(function () {
        wireEditorEnhancements();
      });

      observer.observe(document.body, { childList: true, subtree: true });
      window.addEventListener('hashchange', wireEditorEnhancements);
      window.addEventListener('load', wireEditorEnhancements);
      setInterval(wireEditorEnhancements, 1200);
    })();
  </script>
</body>
</html>
