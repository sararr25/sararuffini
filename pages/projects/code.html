<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,typography,container-queries"></script>
<script>
  tailwind.config = {
    darkMode: "class",
    theme: {
      extend: {
        colors: {
          primary: "#40E0D0", // Cyan color
          secondary: "#1a1a1a", // Dark almost black color
          "background-light": "#F8F4EC", // Cream background
          "background-dark": "#121212", // Dark mode background
          "card-light": "#ffffff",
          "card-dark": "#1E1E1E",
          "accent-yellow": "#FFEB3B", // Vivid Yellow
          "accent-pink": "#FF69B4", // Hot Pink
          "accent-orange": "#FF6B6B", // Salmon/Orange
          "accent-green": "#7FFF00", // Chartreuse
          "accent-purple": "#D8BFD8", // Thistle
        },
        fontFamily: {
          display: ["'Inter'", "sans-serif"], 
          script: ["'Permanent Marker'", "cursive"], 
          body: ["'Space Grotesk'", "sans-serif"],
        },
        boxShadow: {
          'retro': '4px 4px 0px 0px rgba(0,0,0,1)',
          'retro-hover': '2px 2px 0px 0px rgba(0,0,0,1)',
          'sticker': '2px 2px 0px 0px rgba(0,0,0,0.8)',
        },
        animation: {
          'draw': 'draw 0.4s ease-in-out forwards',
        },
        keyframes: {
          draw: {
            '0%': { strokeDasharray: '0 100', opacity: '0' },
            '10%': { opacity: '1' },
            '100%': { strokeDasharray: '100 0', opacity: '1' },
          }
        }
      },
    },
  };
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&amp;family=Permanent+Marker&amp;family=Space+Grotesk:wght@400;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="../../styles/projects.css"/>
<link rel="stylesheet" href="../../styles/shared-nav-footer.css"/>
<link rel="stylesheet" href="../../styles/mobile.css"/>
</head>
<body class="bg-background-light dark:bg-background-dark text-secondary dark:text-white font-body transition-colors duration-300 min-h-screen relative overflow-x-hidden selection:bg-primary selection:text-black flex flex-col" data-cms-page="projects">
<div class="fixed top-0 right-0 w-[500px] h-[500px] bg-gradient-to-br from-pink-400/20 to-purple-500/20 rounded-full blur-[100px] -z-10 pointer-events-none translate-x-1/2 -translate-y-1/2 dark:opacity-10"></div>
<div class="fixed bottom-0 left-0 w-[600px] h-[600px] bg-gradient-to-tr from-primary/10 to-accent-yellow/10 rounded-full blur-[120px] -z-10 pointer-events-none -translate-x-1/3 translate-y-1/3 dark:opacity-5"></div>
<div class="fixed inset-0 bg-[url('https://www.transparenttextures.com/patterns/noise.png')] opacity-[0.03] pointer-events-none z-0 mix-blend-overlay"></div>
<nav class="shared-site-nav" data-shared-chrome="nav"></nav>

<main class="flex-grow max-w-7xl mx-auto px-6 py-8 md:py-16 relative w-full">
<div class="projects-intro mb-16 relative flex flex-col md:flex-row justify-between items-end gap-6 border-b border-black/10 dark:border-white/10 pb-8">
<div class="relative z-10">
<h1 class="text-4xl md:text-5xl font-display font-black leading-[0.9] tracking-tighter relative z-10">
<span data-cms-text="heading_line1">SELECTED</span> <br/>
<span class="relative inline-block mt-2">
<span class="relative z-10" data-cms-text="heading_line2">WORKS</span>
<svg class="absolute w-[110%] h-[120%] -top-[10%] -left-[5%] -z-10 text-primary rotate-1" fill="currentColor" preserveAspectRatio="none" viewBox="0 0 200 60">
<path d="M5,50 C50,65 150,25 195,45" fill="none" stroke="currentColor" stroke-linecap="round" stroke-opacity="0.4" stroke-width="25"></path>
</svg>
</span>
</h1>
</div>
<div class="relative z-20 max-w-md text-right hidden md:block">
<p class="text-sm md:text-base font-body leading-relaxed text-gray-800 dark:text-gray-200" data-cms-html="intro_text_html">
                Visual storytelling through rhythm and color. <br/>
<span class="font-script text-accent-pink text-xl">Curated for impact.</span>
</p>
</div>
</div>
<div class="absolute top-[280px] left-0 hidden xl:block -z-0 pointer-events-none w-24 h-24 rotate-12">
<svg class="text-black/20 dark:text-white/20 w-full h-full" viewBox="0 0 100 100">
<path d="M10,10 Q50,50 80,80" fill="none" marker-end="url(#arrowhead)" stroke="currentColor" stroke-dasharray="4 4" stroke-width="2"></path>
<defs>
<marker id="arrowhead" markerHeight="7" markerWidth="10" orient="auto" refX="0" refY="3.5">
<polygon fill="currentColor" points="0 0, 10 3.5, 0 7"></polygon>
</marker>
</defs>
</svg>
</div>
<div class="masonry-grid w-full" data-cms-gallery="gallery"></div>
</main>
<footer class="shared-site-footer" data-shared-chrome="footer"></footer>
<script src="../../scripts/cms-page-loader.js"></script>
<script src="../../scripts/shared-site-chrome.js"></script>
<script src="../../scripts/mobile-nav.js"></script>
</body></html>
